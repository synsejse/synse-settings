# Shadows the stock throughput-performance profile (tuned-ppd maps KDE's
# "performance" power mode to this profile name; profiles in /etc/tuned
# take precedence over /usr/lib/tuned).
#
# The stock profile sets vm.swappiness=10, vm.dirty_ratio=40 and
# vm.dirty_background_ratio=10 AFTER sysctl.d is applied, silently
# overriding the zram-oriented VM tuning in
# /usr/lib/sysctl.d/70-synse-settings.conf and
# /usr/lib/udev/rules.d/30-zram.rules. This variant keeps the CPU/platform
# performance behaviour but deliberately ships no [sysctl] section, so the
# sysctl.d / udev values stay in effect.

[main]
summary=Desktop performance profile that defers VM tuning to sysctl.d

[cpu]
governor=performance
energy_perf_bias=performance
energy_performance_preference=performance
min_perf_pct=100
boost=1

[acpi]
platform_profile=performance

[video]
panel_power_savings=0

[disk]
readahead=>4096
