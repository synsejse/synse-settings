# Enable THP system-wide. Measurable gains in games and allocator-heavy
# workloads; the memory-bloat downside of "always" is handled by the THP
# shrinker tuning in thp-shrinker.conf (which assumes this policy).
w! /sys/kernel/mm/transparent_hugepage/enabled - - - - always

# Improve performance for applications that use tcmalloc
# https://github.com/google/tcmalloc/blob/master/docs/tuning.md#system-level-optimizations
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
